<!DOCTYPE html>
<head>
    <meta charset='UTF-8'>
<title>在线剪切板</title>
    <meta name='viewport' content='width=device-width, initial-scale=1, shrink-to-fit=no'>
    <link rel='icon' href='{{FAVICON}}' type='image/png' />
    <style media='screen'>
        {{CSS}}
    </style>
    <style>
        /* 样式补丁 */
        body {
            padding-top: 0.5rem;
        }

        .markdown-body {
            padding-top: 0.5rem;
        }

        /* 美化标题 */
        .site-title {
            margin: 0.5rem 0 1rem 0 !important;
            padding: 0 !important;
            border: none !important;
            font-size: 28px !important;
            font-weight: 700 !important;
            letter-spacing: -0.5px;
        }

        .site-title a {
            color: #1a1a1a;
            text-decoration: none;
            transition: color 0.2s;
        }

        .site-title a:hover {
            color: #000000;
        }

        /* 调整面板间距 */
        #paste-input-panel, #paste-setting-panel, #paste-uploaded-panel {
            margin: 0.5rem 0 !important;
        }

        /* 减少顶部留白 */
        .my-1 { 
            margin-top: 0.25rem !important; 
            margin-bottom: 0.5rem !important; 
        }

        .px-2 {
            padding-left: 0.5rem !important;
            padding-right: 0.5rem !important;
        }

        /* 移动端优化：所有面板宽度一致 */
        @media (max-width: 768px) {
            #paste-input-panel, #paste-setting-panel, #paste-uploaded-panel {
                margin: 0.5rem 5% !important;
                width: 90% !important;
            }
            
            #paste-textarea {
                min-height: 320px !important;
            }
        }
    </style>
</head>
<html lang='zh-CN'>
<body>
<div class='px-2 my-1 markdown-body'>
    <h2 class="site-title"><a href='index.html'>在线剪切板</a></h2>

    <div id='main-panels' class='panels'>
    <div id='paste-input-panel'>
        <div id='paste-header'>
            <div class='paste-header-tabs'>
                <div class="paste-tab enabled" id='paste-tab-edit'>编辑文本</div>
                <div class="paste-tab" id='paste-tab-preview'>预览</div>
                <label for='paste-file-upload' id='paste-tab-file' class='paste-tab'>
                    <input type='file' placeholder='' id='paste-file-upload'>
                    <label for='paste-file-upload'>上传文件</label>
                </label>
            </div>
            <div></div>
        </div>
        <div class="paste-tab-page enabled" id='paste-edit'>
            <textarea placeholder='在此输入内容' id='paste-textarea' name='c' rows='20'></textarea>
        </div>
        <div class="paste-tab-page" id='paste-preview'>
             <div id="preview-content" class="markdown-body" style="padding: 1em;"></div>
        </div>
        <div class='paste-tab-page' id='paste-file-show'>
            <p id='paste-file-line'>
                <code class='file-name'></code>: <span class='file-size'></span>
            </p>
        </div>
    </div>

    <div id='paste-setting-panel'>
        <h3>设置</h3>
        <div id='paste-expiration-panel' class='paste-setting-subitem-panel'>
            <div class="setting-row">
                <input list='expiration-choices' type='text' min='60' step='1' name='paste-expiration'
                       id='paste-expiration-input' placeholder='过期时间' value='7M'>
                <label class='inline-label' for='paste-expiration-input'>留空永久保存 (s秒 m分 h时 d天 M月 Y年)</label>
            </div>
        </div>
        <div id='paste-view-passwd-panel' class='paste-setting-subitem-panel'>
            <div class="setting-row">
                <input type='text' spellcheck='false' id='paste-view-passwd-input' placeholder='访问密码（可选）'>
                <label class='inline-label' for='paste-view-passwd-input'>需要密码才能查看</label>
            </div>
        </div>
        <div id='paste-passwd-panel' class='paste-setting-subitem-panel'>
            <div class="setting-row">
                <input type='text' spellcheck='false' name='paste-expiration' id='paste-passwd-input' placeholder='管理密码'>
                <label class='inline-label' for='paste-passwd-input'>用于删除或更新，留空自动生成</label>
            </div>
        </div>
        <div class='label-line'>
            <input type='checkbox' id='paste-as-markdown-checkbox'>
            <label for='paste-as-markdown-checkbox' class='radio-label'>渲染为 Markdown</label>
        </div>
        <div class='label-line'>
            <input type='radio' name='url-type' value='short' id='paste-url-short-radio' checked>
            <label for='paste-url-short-radio' class='radio-label'>生成短链接</label>
            <span class='small-label'>示例：{{BASE_URL}}/BxWH</span>
        </div>
        <div class='label-line'>
            <input type='radio' name='url-type' value='custom' id='paste-url-custom-radio'>
            <label for='paste-url-custom-radio' class='radio-label'>自定义链接</label>
            <div id='paste-url-input-wrapper'>
                <span id='paste-url-input-prefix'>{{BASE_URL}}/</span>
                <input type='text' id='paste-custom-url-input' minlength='3' name='custom-url'>
            </div>
            <span class='small-label'>示例：{{BASE_URL}}/my-note</span>
        </div>
        <div class='label-line'>
            <input type='radio' name='url-type' value='admin' id='paste-url-admin-radio'>
            <label for='paste-url-admin-radio' class='radio-label'>更新内容</label>
            <input type='url' spellcheck='false' id='paste-admin-url-input'
                   name='admin-url' value='{{BASE_URL}}'>
        </div>
        <div>
            <button id='submit-button' class='long-button px-3 py-2 my-1'>提交</button>
            <button id='delete-button' class='long-button hidden px-3 py-2 my-1'>删除</button>
            <span id='submit-error-msg'></span>
        </div>

        <div id='paste-uploaded-panel' class='hidden'>
            <h2>上传成功</h2>
            <div class='uploaded-entry'>
                <input id='uploaded-url' type='text' class='uploaded-table-text' readonly>
                <button class='copy-button'>复制</button>
            </div>
            <label for='uploaded-url' class='small-label'>普通链接（只读）</label>
            <div class='uploaded-entry'>
                <input id='uploaded-admin-url' type='text' class='uploaded-table-text' readonly>
                <button class='copy-button'>复制</button>
            </div>
            <label for='suggest-url' class='small-label'>管理链接（可修改内容）</label>
            <div class='uploaded-entry'>
                <input type='text' id='uploaded-expiration' class='uploaded-table-text' readonly>
            </div>
            <label for='uploaded-expiration' class='small-label'>过期时间（秒）</label>
        </div>
    </div>
    </div>
    
</div>
<footer class='px-3 my-2 text-center'>
    <p>
        <a href='{{BASE_URL}}/tos' class='d-inline-block'>服务条款</a>
        /
        <a href='{{BASE_URL}}/api' class='d-inline-block'>API 文档</a>
    </p>
</footer>
<script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js'></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    {{INDEX_JS}}
</script>
</body>
</html>
